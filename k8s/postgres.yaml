apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: rust-app
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app        # learning only: throwaway in-cluster database
  POSTGRES_DB: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: rust-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "app"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rust-app
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432