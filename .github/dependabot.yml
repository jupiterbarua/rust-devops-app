version: 2
updates:
  # Keep pinned GitHub Actions up to date (updates the SHA and the version comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Keep Rust dependencies up to date
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly